
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanze Tommaso PRO</title>
<style>
body { font-family: Arial, sans-serif; background:#0f172a; color:white; margin:0; padding:20px; }
.card { background:#1e293b; padding:20px; border-radius:12px; margin-bottom:15px; }
h1 { margin-top:0; }
input, button { padding:10px; border-radius:8px; border:none; margin:5px 0; }
button { background:#22c55e; color:white; font-weight:bold; }
.progress { height:20px; background:#334155; border-radius:10px; overflow:hidden; }
.bar { height:100%; background:#22c55e; width:0%; }
</style>
</head>
<body>

<h1>💰 Finanze Tommaso PRO</h1>

<div class="card">
<h2>Obiettivo 50.000€</h2>
<input type="number" id="risparmi" placeholder="Quanto hai risparmiato">
<button onclick="aggiorna()">Aggiorna</button>
<div class="progress"><div class="bar" id="barra"></div></div>
<p id="testo"></p>
</div>

<div class="card">
<h2>Simulazione Casa</h2>
<input type="number" id="prezzo" placeholder="Prezzo casa">
<input type="number" id="anticipo" placeholder="Anticipo">
<input type="number" id="tasso" placeholder="Tasso %">
<input type="number" id="anni" placeholder="Anni mutuo">
<button onclick="calcolaMutuo()">Calcola rata</button>
<p id="rata"></p>
</div>

<div class="card">
<h2>Contatore giorni senza spese inutili</h2>
<button onclick="incrementa()">+1 giorno</button>
<p id="giorni"></p>
</div>

<script>
let goal = 50000;

function aggiorna() {
 let val = document.getElementById('risparmi').value;
 let perc = (val / goal) * 100;
 document.getElementById('barra').style.width = perc + '%';
 document.getElementById('testo').innerText = "Sei al " + perc.toFixed(1) + "% dell'obiettivo";
 localStorage.setItem("risparmi", val);
}

function calcolaMutuo() {
 let prezzo = parseFloat(document.getElementById('prezzo').value);
 let anticipo = parseFloat(document.getElementById('anticipo').value);
 let tasso = parseFloat(document.getElementById('tasso').value) / 100 / 12;
 let anni = parseFloat(document.getElementById('anni').value) * 12;
 let capitale = prezzo - anticipo;

 let rata = capitale * (tasso * Math.pow(1+tasso, anni)) / (Math.pow(1+tasso, anni) - 1);
 document.getElementById('rata').innerText = "Rata mensile: " + rata.toFixed(2) + " €";
}

let giorni = localStorage.getItem("giorni") || 0;
document.getElementById("giorni").innerText = giorni + " giorni";

function incrementa() {
 giorni++;
 localStorage.setItem("giorni", giorni);
 document.getElementById("giorni").innerText = giorni + " giorni";
}
</script>

</body>
</html>
